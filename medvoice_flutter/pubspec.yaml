name: medvoice_flutter

description: Flutter client for the MedVoice healthcare complaint platform.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.3
  file_picker: ^11.0.2
  provider: ^6.1.5
  go_router: ^16.0.0
  dio: ^5.8.0+1
  cookie_jar: ^4.0.1
  url_launcher: ^6.2.0
  flutter_secure_storage: ^9.2.4
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  image_picker: ^1.1.2
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.7.0
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/login_bg.svg
    - assets/images/hero_illustration.svg
