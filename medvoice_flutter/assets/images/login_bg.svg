<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="deepBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" /> <!-- Deep Blue -->
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" /> <!-- Med Blue -->
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.1" />
      <stop offset="50%" style="stop-color:#60a5fa;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="800" height="600" fill="url(#deepBlueGrad)" />
  
  <!-- Subtle Grid Background -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-width="0.5" opacity="0.05"/>
  </pattern>
  <rect width="800" height="600" fill="url(#grid)" />

  <!-- Abstract Waves (Voice/Data Flow) -->
  <g transform="translate(0, 100)" opacity="0.8">
      <path d="M0 300 C 200 200, 600 400, 800 300 V 600 H 0 Z" fill="url(#waveGrad)" />
      <path d="M0 350 C 250 250, 550 450, 800 350 V 600 H 0 Z" fill="url(#waveGrad)" opacity="0.6"/>
      <path d="M0 400 C 300 300, 500 500, 800 400 V 600 H 0 Z" fill="url(#waveGrad)" opacity="0.4"/>
  </g>

  <!-- Connected Nodes (Network) -->
  <g filter="url(#glow)" opacity="0.6">
      <circle cx="100" cy="150" r="3" fill="#60a5fa" />
      <circle cx="250" cy="100" r="2" fill="#60a5fa" />
      <circle cx="450" cy="200" r="4" fill="#60a5fa" />
      <circle cx="650" cy="120" r="2" fill="#60a5fa" />
      
      <line x1="100" y1="150" x2="250" y2="100" stroke="#60a5fa" stroke-width="0.5" opacity="0.3" />
      <line x1="250" y1="100" x2="450" y2="200" stroke="#60a5fa" stroke-width="0.5" opacity="0.3" />
      <line x1="450" y1="200" x2="650" y2="120" stroke="#60a5fa" stroke-width="0.5" opacity="0.3" />
  </g>
</svg>
