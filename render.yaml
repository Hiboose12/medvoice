services:
  - type: web
    name: medvoice-backend
    runtime: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput && python manage.py seed_demo_accounts"
    startCommand: "gunicorn medVoice.wsgi:application --bind 0.0.0.0:$PORT"
    rootDir: medVoice
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: medvoice-db
          property: connectionString
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"

databases:
  - name: medvoice-db
    plan: free
