{% extends 'patients/patient_base.html' %}

{% block title %}Edit Complaint{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">
  <div class="bg-white rounded-2xl shadow-soft border border-zinc-100 p-8">
    <h1 class="text-2xl font-bold text-text-main mb-2">Edit Complaint</h1>
    <p class="text-text-muted text-sm mb-6">Update your complaint details after marking it as satisfied.</p>

    <form method="POST" enctype="multipart/form-data" class="space-y-6">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="flex justify-end gap-3">
        <a href="{% url 'complaint_detail' complaint.id %}"
          class="px-4 py-2 rounded-lg border border-zinc-200 text-text-main text-sm font-bold hover:bg-zinc-50 transition-colors">
          Cancel
        </a>
        <button type="submit"
          class="px-4 py-2 rounded-lg bg-primary text-white text-sm font-bold hover:bg-blue-600 transition-colors">
          Save Changes
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
