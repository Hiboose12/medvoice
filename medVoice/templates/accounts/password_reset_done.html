{% extends 'accounts/base_auth.html' %}
{% load static %}

{% block title %}Email Sent{% endblock %}

{% block auth_content %}
<div class="hidden md:flex w-5/12 bg-[#1e3a8a] relative items-center justify-center overflow-hidden">
    <img src="{% static 'img/login_bg.svg' %}" class="absolute inset-0 w-full h-full object-cover opacity-80"
        alt="Background">
</div>

<div class="w-full md:w-7/12 flex flex-col justify-center items-center p-8 bg-white">
    <div class="w-full max-w-md text-center">
        <div class="h-16 w-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
            <span class="material-symbols-outlined text-green-600 text-3xl">mark_email_read</span>
        </div>
        <h2 class="text-2xl font-bold text-gray-900 mb-2">Email Sent!</h2>
        <p class="text-gray-600 mb-8">
            We've sent password reset instructions to your email address. Please check your inbox (and spam folder).
        </p>
        <a href="{% url 'login' %}" class="text-blue-600 font-bold hover:underline">Back to Login</a>
    </div>
</div>
{% endblock %}
