{% extends 'accounts/base_auth.html' %}
{% load static %}

{% block title %}Reset Complete{% endblock %}

{% block auth_content %}
<div class="hidden md:flex w-5/12 bg-[#1e3a8a] relative items-center justify-center overflow-hidden">
    <img src="{% static 'img/login_bg.svg' %}" class="absolute inset-0 w-full h-full object-cover opacity-80"
        alt="Background">
</div>

<div class="w-full md:w-7/12 flex flex-col justify-center items-center p-8 bg-white">
    <div class="w-full max-w-md text-center">
        <div class="h-16 w-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-6">
            <span class="material-symbols-outlined text-blue-600 text-3xl">check_circle</span>
        </div>
        <h2 class="text-2xl font-bold text-gray-900 mb-2">Password Reset Successful</h2>
        <p class="text-gray-600 mb-8">
            Your password has been set. You can now log in with your new password.
        </p>
        <a href="{% url 'login' %}"
            class="inline-block bg-blue-600 text-white font-bold py-3 px-8 rounded-lg shadow-sm hover:bg-blue-700 transition-colors">
            Log In Now
        </a>
    </div>
</div>
{% endblock %}
