{% extends 'accounts/base_auth.html' %}
{% load static %}

{% block title %}Reset Password{% endblock %}

{% block auth_content %}
<!-- Left Side using same bg as login -->
<div class="hidden md:flex w-5/12 bg-[#1e3a8a] relative items-center justify-center overflow-hidden">
    <img src="{% static 'img/login_bg.svg' %}" class="absolute inset-0 w-full h-full object-cover opacity-80"
        alt="Background">
    <div class="relative z-10 p-12 text-left">
        <h1 class="text-4xl font-bold text-white mb-4">Reset Password</h1>
        <p class="text-blue-200">Enter your email to receive instructions.</p>
    </div>
</div>

<div class="w-full md:w-7/12 flex flex-col justify-center items-center p-8 md:p-24 bg-white relative">
    <div class="w-full max-w-md">
        <h2 class="text-3xl font-bold text-gray-900 mb-6">Forgot Password?</h2>

        <form method="POST" class="flex flex-col gap-6">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Email Address</label>
                <input type="email" name="email" required
                    class="w-full border border-gray-300 rounded-lg px-4 py-3 text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600 transition-all">
            </div>

            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-lg shadow-sm hover:shadow transition-all">
                Send Reset Link
            </button>
        </form>

        <div class="text-center mt-6">
            <a href="{% url 'login' %}" class="font-semibold text-blue-600 hover:text-blue-800">Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
