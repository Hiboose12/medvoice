{% load static %}
<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedVoice - {% block title %}Admin{% endblock %}</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700;900&display=swap" rel="stylesheet" />

    <!-- Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="icon" href="{% static 'images/favicon.ico' %}">

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                        "text-main": "#0d141b",
                        "text-muted": "#4c739a",
                    },
                    fontFamily: {
                        display: ["Public Sans", "sans-serif"],
                    },
                },
            },
        }
    </script>

    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="bg-background-light dark:bg-background-dark text-text-main dark:text-white font-display antialiased overflow-x-hidden">
    <div id="admin-sidebar-overlay" class="fixed inset-0 bg-black/40 z-40 hidden lg:hidden"></div>
    <div class="flex min-h-screen w-full">
        {% include "includes/superadmin_sidebar.html" %}
        <div class="flex-1 flex flex-col min-w-0 bg-background-light dark:bg-background-dark">
            <header class="lg:hidden flex items-center justify-between p-4 bg-white dark:bg-[#1a2632] border-b border-[#cfdbe7] dark:border-gray-800 sticky top-0 z-30">
                <div class="flex items-center gap-2">
                    {% include "includes/medvoice_logo.html" %}
                </div>
                <button id="admin-sidebar-open" class="text-[#0d141b] dark:text-white">
                    <span class="material-symbols-outlined" style="font-size: 24px;">menu</span>
                </button>
            </header>

            <main class="flex-1 px-4 py-8 md:px-8 lg:px-12 max-w-[1600px] mx-auto w-full">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <script>
        (function () {
            const sidebar = document.getElementById('admin-sidebar');
            const openBtn = document.getElementById('admin-sidebar-open');
            const closeBtn = document.getElementById('admin-sidebar-close');
            const overlay = document.getElementById('admin-sidebar-overlay');

            if (!sidebar || !openBtn || !overlay) {
                return;
            }

            function openSidebar() {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                document.body.classList.add('overflow-hidden');
            }

            function closeSidebar() {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
                document.body.classList.remove('overflow-hidden');
            }

            openBtn.addEventListener('click', openSidebar);
            if (closeBtn) {
                closeBtn.addEventListener('click', closeSidebar);
            }
            overlay.addEventListener('click', closeSidebar);
        })();
    </script>
    {% block page_scripts %}{% endblock %}
</body>
</html>
