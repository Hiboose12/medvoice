<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" /> <!-- Blue 500 -->
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" /> <!-- Blue 700 -->
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <mask id="fadeEdges">
      <rect x="0" y="0" width="800" height="600" fill="url(#maskGrad)" />
    </mask>
    <radialGradient id="maskGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="70%" style="stop-color:white;stop-opacity:1" />
      <stop offset="100%" style="stop-color:black;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <g mask="url(#fadeEdges)">
      <!-- Background subtle shapes -->
      <circle cx="200" cy="200" r="250" fill="url(#blueGrad)" opacity="0.05" />
      <circle cx="600" cy="400" r="200" fill="url(#blueGrad)" opacity="0.05" />

      <!-- Central Structure -->
      <g transform="translate(400, 300)">
        <!-- Rings -->
        <circle cx="0" cy="0" r="180" stroke="url(#blueGrad)" stroke-width="1" fill="none" opacity="0.3" stroke-dasharray="10,10"/>
        <circle cx="0" cy="0" r="220" stroke="url(#blueGrad)" stroke-width="0.5" fill="none" opacity="0.2" />
        
        <!-- Central Hexagon -->
        <path d="M0 -100 L86.6 -50 L86.6 50 L0 100 L-86.6 50 L-86.6 -50 Z" fill="url(#blueGrad)" opacity="0.1" />
        <path d="M0 -80 L69 -40 L69 40 L0 80 L-69 40 L-69 -40 Z" fill="none" stroke="url(#blueGrad)" stroke-width="2" />
        
        <!-- Medical Cross -->
        <rect x="-25" y="-70" width="50" height="140" rx="5" fill="url(#blueGrad)" filter="url(#glow)" />
        <rect x="-70" y="-25" width="140" height="50" rx="5" fill="url(#blueGrad)" filter="url(#glow)" />
        
        <!-- Inner Cross -->
        <rect x="-10" y="-50" width="20" height="100" rx="2" fill="white" opacity="0.9" />
        <rect x="-50" y="-10" width="100" height="20" rx="2" fill="white" opacity="0.9" />
      </g>

      <!-- Floating Data Nodes -->
      <g filter="url(#glow)">
          <circle cx="600" cy="200" r="15" fill="#3b82f6" />
          <circle cx="200" cy="400" r="10" fill="#1d4ed8" />
          <circle cx="650" cy="450" r="8" fill="#1e40af" />
          
          <line x1="450" y1="250" x2="600" y2="200" stroke="#3b82f6" stroke-width="2" opacity="0.4" />
          <line x1="350" y1="350" x2="200" y2="400" stroke="#1d4ed8" stroke-width="2" opacity="0.4" />
          <line x1="450" y1="350" x2="650" y2="450" stroke="#1e40af" stroke-width="2" opacity="0.4" />
      </g>

      <!-- Pulse -->
      <circle cx="600" cy="200" r="25" stroke="#3b82f6" stroke-width="1" fill="none" opacity="0.5" />
  </g>
</svg>
